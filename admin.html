<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduTrain - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="text-slate-800">

    <div class="min-h-screen bg-slate-50 flex">
        <!-- Sidebar Container -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-h-screen md:ml-64 transition-all duration-300">
            <!-- Header Container -->
            <div id="header-container"></div>

            <main id="app" class="flex-1 p-8 overflow-x-hidden">
                <!-- Dynamic Content Will Be Loaded Here -->
            </main>

            <footer class="p-8 text-center text-sm text-slate-400">
                &copy; 2024 EduTrain. All rights reserved.
            </footer>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
